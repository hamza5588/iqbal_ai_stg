<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a Teacher | Iqbal AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='teacher/css/theme-colors.css') }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode:"class",
      theme:{ extend:{
        fontFamily:{ sans:["Inter","system-ui","sans-serif"], display:["Poppins","Inter","sans-serif"] },
        colors:{
          primary:{50:"#f0f9ff",100:"#e0f2fe",200:"#bae6fd",400:"#38bdf8",500:"#0ea5e9",600:"#0284c7",700:"#0369a1"},
          accent: {50:"#fdf2f8",400:"#f472b6",500:"#ec4899",600:"#db2777"},
          success:{50:"#f0fdf4",100:"#dcfce7",500:"#22c55e",600:"#16a34a"},
          error:  {50:"#fef2f2",500:"#ef4444"},
          warning:{50:"#fffbeb",500:"#f59e0b"},
        },
      }},
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { -webkit-font-smoothing:antialiased; }
    .glass-morphism { background:rgba(255,255,255,0.7); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.3); }
    .teacher-card { background:white; border-radius:1rem; border:1px solid #e5e7eb; padding:1.25rem; transition:all .2s; }
    .teacher-card:hover { box-shadow:0 4px 20px rgba(0,0,0,.08); transform:translateY(-2px); }
    .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:9999px; font-size:.7rem; font-weight:600; background:#e0f2fe; color:#0369a1; }
    .badge-avail { background:#f0fdf4; color:#15803d; }
    .star-filled { color:#f59e0b; }
    .star-empty  { color:#d1d5db; }
    .filter-chip { padding:5px 12px; border-radius:9999px; border:1.5px solid #cbd5e1; font-size:.8rem; cursor:pointer; transition:all .2s; background:white; color:#475569; white-space:nowrap; }
    .filter-chip.active { background:#0ea5e9; color:white; border-color:#0ea5e9; }
    .toast { position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999; padding:.85rem 1.25rem; border-radius:.75rem; font-size:.875rem; font-weight:500; display:flex; align-items:center; gap:.5rem; box-shadow:0 8px 24px rgba(0,0,0,.15); transform:translateY(100px); opacity:0; transition:all .3s; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    .toast.error   { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    input:focus, select:focus { outline:none; border-color:#0ea5e9; box-shadow:0 0 0 3px rgba(14,165,233,.15); }
    .skeleton { background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%); background-size:200px 100%; animation:shimmer 1.5s infinite; border-radius:6px; }
    @keyframes shimmer { 0%{background-position:-200px 0} 100%{background-position:calc(200px + 100%) 0} }
    .req-pending { background:#fef3c7; color:#92400e; border-color:#fde68a; }
    .req-accepted{ background:#d1fae5; color:#065f46; border-color:#6ee7b7; }
    .req-rejected{ background:#fee2e2; color:#991b1b; border-color:#fca5a5; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

  <!-- Nav -->
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/student-dashboard" class="text-gray-500 hover:text-primary-600 transition-colors"><i class="fas fa-arrow-left"></i></a>
        <h1 class="text-lg font-semibold text-gray-900 font-display">Find a Teacher</h1>
      </div>
      <a href="/student-connections" class="text-sm text-primary-600 hover:underline font-medium flex items-center gap-1">
        <i class="fas fa-link"></i> My Requests
      </a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- Search & Filters -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6">
      <!-- Search bar -->
      <div class="relative mb-4">
        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input id="searchInput" type="text" placeholder="Search teachers by name, subject or city…"
          class="w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl text-sm transition-all"
          oninput="debouncedSearch()" />
      </div>

      <!-- Filter row -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Subject</label>
          <select id="filterSubject" onchange="applyFilters()" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white transition-all">
            <option value="">All subjects</option>
            <option>Mathematics</option><option>Physics</option><option>Chemistry</option>
            <option>Biology</option><option>English</option><option>Urdu</option>
            <option>Islamiat</option><option>Computer Science</option><option>Economics</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Grade</label>
          <select id="filterGrade" onchange="applyFilters()" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white transition-all">
            <option value="">All grades</option>
            <option>6</option><option>7</option><option>8</option><option>9</option>
            <option>10</option><option>11</option><option>12</option>
            <option>O-Level</option><option>A-Level</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">City</label>
          <input id="filterCity" type="text" placeholder="e.g. Lahore"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm transition-all" oninput="debouncedSearch()" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Availability</label>
          <select id="filterAvail" onchange="applyFilters()" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white transition-all">
            <option value="">Any</option>
            <option value="full_time">Full-time</option>
            <option value="part_time">Part-time</option>
            <option value="weekends">Weekends</option>
            <option value="evenings">Evenings</option>
          </select>
        </div>
      </div>

      <!-- Province filter chips -->
      <div class="mt-3 flex flex-wrap gap-2">
        <span class="text-xs text-gray-400 self-center">Province:</span>
        <button class="filter-chip active" data-province="" onclick="setProvince(this,'')">All</button>
        <button class="filter-chip" data-province="Punjab" onclick="setProvince(this,'Punjab')">Punjab</button>
        <button class="filter-chip" data-province="Sindh" onclick="setProvince(this,'Sindh')">Sindh</button>
        <button class="filter-chip" data-province="KPK" onclick="setProvince(this,'Khyber Pakhtunkhwa')">KPK</button>
        <button class="filter-chip" data-province="Balochistan" onclick="setProvince(this,'Balochistan')">Balochistan</button>
      </div>
    </div>

    <!-- Results header -->
    <div class="flex items-center justify-between mb-4">
      <p class="text-sm text-gray-500"><span id="resultCount">0</span> teachers found</p>
      <select id="sortBy" onchange="applyFilters()" class="px-3 py-1.5 border border-gray-200 rounded-lg text-sm bg-white">
        <option value="relevance">Sort: Relevance</option>
        <option value="rating">Sort: Highest Rated</option>
        <option value="experience">Sort: Most Experienced</option>
      </select>
    </div>

    <!-- Teacher cards grid -->
    <div id="teacherGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- skeleton loaders -->
      <div class="teacher-card"><div class="skeleton h-20 mb-3"></div><div class="skeleton h-4 mb-2 w-3/4"></div><div class="skeleton h-3 w-1/2"></div></div>
      <div class="teacher-card"><div class="skeleton h-20 mb-3"></div><div class="skeleton h-4 mb-2 w-3/4"></div><div class="skeleton h-3 w-1/2"></div></div>
      <div class="teacher-card"><div class="skeleton h-20 mb-3"></div><div class="skeleton h-4 mb-2 w-3/4"></div><div class="skeleton h-3 w-1/2"></div></div>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="hidden text-center py-16 text-gray-400">
      <i class="fas fa-user-slash text-5xl mb-4 opacity-30"></i>
      <p class="text-lg font-medium">No teachers found</p>
      <p class="text-sm mt-1">Try adjusting your filters.</p>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="mt-6 flex justify-center gap-2 hidden"></div>

  </main>

  <!-- Connection Request Modal -->
  <div id="reqModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
      <div class="p-6">
        <div class="flex items-center gap-3 mb-4">
          <div id="reqAvatar" class="w-12 h-12 rounded-full bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center text-white font-bold text-lg"></div>
          <div>
            <h3 id="reqName" class="text-base font-semibold text-gray-900"></h3>
            <p id="reqSubjects" class="text-sm text-gray-500"></p>
          </div>
        </div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Subject you want to study <span class="text-red-500">*</span></label>
        <select id="reqSubject" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm mb-3 bg-white">
          <option value="">Select subject</option>
        </select>
        <label class="block text-sm font-medium text-gray-700 mb-2">Message (optional)</label>
        <textarea id="reqMessage" rows="3" placeholder="Introduce yourself and explain why you'd like to study with this teacher…"
          class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm mb-4 resize-none"></textarea>
        <div class="flex gap-2">
          <button onclick="submitRequest()"
            class="flex-1 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl font-medium text-sm hover:shadow transition-all">
            <i class="fas fa-paper-plane mr-1.5"></i>Send Request
          </button>
          <button onclick="closeReqModal()"
            class="flex-1 py-2.5 border border-gray-200 text-gray-600 rounded-xl font-medium text-sm hover:bg-gray-50">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let allTeachers = [];
    let filtered    = [];
    let selectedProvince = "";
    let currentPage = 1;
    const PAGE_SIZE = 9;
    let _reqTeacherId = null;
    let pendingRequestIds = new Set(); // teacher IDs with pending/accepted requests

    let _debounceTimer;
    function debouncedSearch() { clearTimeout(_debounceTimer); _debounceTimer = setTimeout(applyFilters, 300); }

    // -----------------------------------------------------------------------
    // Boot
    // -----------------------------------------------------------------------
    document.addEventListener("DOMContentLoaded", () => { loadTeachers(); loadMyRequests(); });

    async function loadTeachers() {
      try {
        const res = await fetch("/api/teacher/discovery", { credentials:"same-origin" });
        if (!res.ok) throw new Error();
        const d = await res.json();
        allTeachers = d.teachers || [];
        applyFilters();
      } catch (_) {
        // Show demo data in case API not available yet
        allTeachers = getDemoTeachers();
        applyFilters();
      }
    }

    async function loadMyRequests() {
      try {
        const res = await fetch("/api/connections/student/my-requests", { credentials:"same-origin" });
        if (!res.ok) return;
        const d = await res.json();
        (d.requests || []).forEach(r => { if (r.status !== "rejected") pendingRequestIds.add(r.teacher_id); });
      } catch (_) {}
    }

    // -----------------------------------------------------------------------
    // Filters
    // -----------------------------------------------------------------------
    function setProvince(btn, prov) {
      document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedProvince = prov;
      applyFilters();
    }

    function applyFilters() {
      const q    = document.getElementById("searchInput").value.toLowerCase().trim();
      const subj = document.getElementById("filterSubject").value;
      const grade= document.getElementById("filterGrade").value;
      const city = document.getElementById("filterCity").value.toLowerCase().trim();
      const avail= document.getElementById("filterAvail").value;
      const sort = document.getElementById("sortBy").value;

      filtered = allTeachers.filter(t => {
        if (q && !(`${t.first_name} ${t.last_name}`.toLowerCase().includes(q)) &&
            !(t.subjects||[]).some(s=>s.toLowerCase().includes(q)) &&
            !(t.city||"").toLowerCase().includes(q)) return false;
        if (subj && !(t.subjects||[]).includes(subj)) return false;
        if (grade && !(t.grades||[]).includes(grade)) return false;
        if (city && !(t.city||"").toLowerCase().includes(city)) return false;
        if (avail && t.availability !== avail) return false;
        if (selectedProvince && t.province !== selectedProvince) return false;
        return true;
      });

      // Sort
      if (sort === "rating")     filtered.sort((a,b)=>(b.rating||0)-(a.rating||0));
      if (sort === "experience") filtered.sort((a,b)=>(b.years_experience||0)-(a.years_experience||0));

      currentPage = 1;
      renderTeachers();
    }

    // -----------------------------------------------------------------------
    // Rendering
    // -----------------------------------------------------------------------
    function renderTeachers() {
      const grid  = document.getElementById("teacherGrid");
      const empty = document.getElementById("emptyState");
      const pager = document.getElementById("pagination");
      document.getElementById("resultCount").textContent = filtered.length;

      if (!filtered.length) { grid.innerHTML=""; empty.classList.remove("hidden"); pager.classList.add("hidden"); return; }
      empty.classList.add("hidden");

      const start = (currentPage-1)*PAGE_SIZE;
      const page  = filtered.slice(start, start+PAGE_SIZE);
      grid.innerHTML = page.map(t => teacherCardHtml(t)).join("");

      // Pagination
      const totalPages = Math.ceil(filtered.length/PAGE_SIZE);
      if (totalPages > 1) {
        pager.classList.remove("hidden");
        pager.innerHTML = Array.from({length:totalPages},(_,i)=>`
          <button onclick="goPage(${i+1})"
            class="px-3 py-1.5 rounded-lg text-sm font-medium border ${i+1===currentPage?"bg-primary-500 text-white border-primary-500":"bg-white text-gray-600 border-gray-200 hover:bg-gray-50"}">
            ${i+1}
          </button>
        `).join("");
      } else { pager.classList.add("hidden"); }
    }

    function goPage(p) { currentPage = p; renderTeachers(); window.scrollTo({top:0,behavior:"smooth"}); }

    function teacherCardHtml(t) {
      const initials = ((t.first_name||"?")[0]+(t.last_name||"?")[0]).toUpperCase();
      const stars    = renderStars(t.rating || 0);
      const subjects = (t.subjects||[]).slice(0,3).map(s=>`<span class="badge">${escHtml(s)}</span>`).join("");
      const hasPending = pendingRequestIds.has(t.id);
      const availLabel = { full_time:"Full-time", part_time:"Part-time", weekends:"Weekends", evenings:"Evenings", flexible:"Flexible" }[t.availability] || "";

      return `
        <div class="teacher-card">
          <div class="flex items-start gap-3 mb-3">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center text-white font-bold text-base flex-shrink-0">
              ${initials}
            </div>
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-gray-900 truncate">${escHtml(t.first_name)} ${escHtml(t.last_name)}</p>
              <p class="text-xs text-gray-500 truncate">${escHtml(t.city||"")}${t.province?", "+escHtml(t.province):""}</p>
              <div class="flex items-center gap-1 mt-0.5">${stars}<span class="text-xs text-gray-400 ml-1">(${t.rating_count||0})</span></div>
            </div>
            ${availLabel ? `<span class="badge badge-avail text-xs">${availLabel}</span>` : ""}
          </div>
          ${t.bio ? `<p class="text-xs text-gray-600 mb-3 line-clamp-2">${escHtml(t.bio)}</p>` : ""}
          <div class="flex flex-wrap gap-1 mb-3">${subjects}</div>
          <div class="flex items-center justify-between text-xs text-gray-400 mb-3">
            <span><i class="fas fa-clock mr-1"></i>${t.years_experience||0} yrs exp</span>
            ${t.qualification ? `<span><i class="fas fa-graduation-cap mr-1"></i>${escHtml(t.qualification)}</span>` : ""}
          </div>
          ${hasPending
            ? `<div class="w-full py-2 text-center rounded-xl border text-xs font-medium req-pending">
                <i class="fas fa-clock mr-1"></i>Request Sent
               </div>`
            : `<button onclick='openReqModal(${JSON.stringify(t)})'
                class="w-full py-2 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl text-sm font-medium hover:shadow transition-all">
                <i class="fas fa-user-plus mr-1.5"></i>Connect
               </button>`
          }
        </div>
      `;
    }

    function renderStars(rating) {
      return Array.from({length:5},(_,i)=>
        `<i class="fas fa-star text-xs ${i<Math.round(rating)?"star-filled":"star-empty"}"></i>`
      ).join("");
    }

    // -----------------------------------------------------------------------
    // Connection request modal
    // -----------------------------------------------------------------------
    function openReqModal(teacher) {
      _reqTeacherId = teacher.id;
      document.getElementById("reqAvatar").textContent = ((teacher.first_name||"?")[0]+(teacher.last_name||"?")[0]).toUpperCase();
      document.getElementById("reqName").textContent   = `${teacher.first_name} ${teacher.last_name}`;
      document.getElementById("reqSubjects").textContent = (teacher.subjects||[]).join(", ");
      document.getElementById("reqMessage").value = "";

      const sel = document.getElementById("reqSubject");
      sel.innerHTML = `<option value="">Select subject</option>`;
      (teacher.subjects||[]).forEach(s => { const o=document.createElement("option"); o.value=s; o.textContent=s; sel.appendChild(o); });

      document.getElementById("reqModal").classList.remove("hidden");
    }

    function closeReqModal() { document.getElementById("reqModal").classList.add("hidden"); _reqTeacherId=null; }

    async function submitRequest() {
      const subject = document.getElementById("reqSubject").value;
      const message = document.getElementById("reqMessage").value.trim();
      if (!subject) { showToast("Please select a subject.", "error"); return; }

      try {
        const res = await fetch("/api/connections/student/request", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          credentials:"same-origin",
          body: JSON.stringify({ teacher_id: _reqTeacherId, subject, message }),
        });
        if (res.ok) {
          pendingRequestIds.add(_reqTeacherId);
          closeReqModal();
          applyFilters();
          showToast("Connection request sent!", "success");
        } else {
          const d = await res.json().catch(()=>({}));
          showToast(d.error || "Failed to send request.", "error");
        }
      } catch (_) { showToast("Network error.", "error"); }
    }

    document.getElementById("reqModal").addEventListener("click", e => { if (e.target===document.getElementById("reqModal")) closeReqModal(); });
    document.addEventListener("keydown", e => { if (e.key==="Escape") closeReqModal(); });

    // -----------------------------------------------------------------------
    // Demo data (fallback while API is set up)
    // -----------------------------------------------------------------------
    function getDemoTeachers() {
      return [
        { id:1, first_name:"Sara",  last_name:"Ahmed",  city:"Lahore",    province:"Punjab", subjects:["Mathematics","Physics"], grades:["9","10","O-Level"], availability:"full_time", years_experience:8, rating:4.7, rating_count:32, bio:"Dedicated math & physics teacher with 8 years experience." },
        { id:2, first_name:"Ali",   last_name:"Raza",   city:"Karachi",   province:"Sindh",  subjects:["English","Urdu"], grades:["6","7","8"], availability:"evenings", years_experience:5, rating:4.2, rating_count:14, bio:"Passionate about languages and literature." },
        { id:3, first_name:"Ayesha",last_name:"Khan",   city:"Islamabad", province:"ICT",    subjects:["Chemistry","Biology"], grades:["11","12","A-Level"], availability:"part_time", years_experience:12, rating:4.9, rating_count:67, bio:"Senior science teacher, PhD from QAU." },
        { id:4, first_name:"Omar",  last_name:"Sheikh", city:"Peshawar",  province:"Khyber Pakhtunkhwa", subjects:["Computer Science"], grades:["9","10","11","12"], availability:"full_time", years_experience:6, rating:4.5, rating_count:21, bio:"CS graduate, loves making programming fun." },
        { id:5, first_name:"Fatima",last_name:"Malik",  city:"Multan",    province:"Punjab", subjects:["Islamiat","Pakistan Studies"], grades:["9","10"], availability:"flexible", years_experience:10, rating:4.3, rating_count:18, bio:"Experienced in social sciences and Islamic studies." },
        { id:6, first_name:"Hassan",last_name:"Siddiqui",city:"Hyderabad",province:"Sindh", subjects:["Mathematics","Statistics"], grades:["11","12","A-Level"], availability:"weekends", years_experience:15, rating:4.8, rating_count:44, bio:"Mathematics specialist with a focus on exam prep." },
      ];
    }

    // -----------------------------------------------------------------------
    // Utils
    // -----------------------------------------------------------------------
    function escHtml(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function showToast(msg, type="success") {
      const t=document.getElementById("toast");
      t.className=`toast ${type}`;
      t.innerHTML=`<i class="fas fa-${type==="success"?"check-circle":"exclamation-circle"}"></i> ${msg}`;
      t.classList.add("show");
      setTimeout(()=>t.classList.remove("show"),3500);
    }
  </script>
</body>
</html>
