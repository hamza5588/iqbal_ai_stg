<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Connection Requests | Iqbal AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='teacher/css/theme-colors.css') }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode:"class",
      theme:{ extend:{
        fontFamily:{ sans:["Inter","system-ui","sans-serif"], display:["Poppins","Inter","sans-serif"] },
        colors:{
          primary:{50:"#f0f9ff",100:"#e0f2fe",500:"#0ea5e9",600:"#0284c7"},
          accent: {500:"#ec4899"},
          success:{50:"#f0fdf4",100:"#dcfce7",500:"#22c55e"},
          error:  {50:"#fef2f2",100:"#fee2e2",500:"#ef4444"},
          warning:{50:"#fffbeb",100:"#fef3c7",500:"#f59e0b"},
        },
      }},
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { -webkit-font-smoothing:antialiased; }
    .status-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:9999px; font-size:.75rem; font-weight:600; }
    .status-pending  { background:#fef3c7; color:#92400e; }
    .status-accepted { background:#d1fae5; color:#065f46; }
    .status-rejected { background:#fee2e2; color:#991b1b; }
    .toast { position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999; padding:.85rem 1.25rem; border-radius:.75rem; font-size:.875rem; font-weight:500; display:flex; align-items:center; gap:.5rem; box-shadow:0 8px 24px rgba(0,0,0,.15); transform:translateY(100px); opacity:0; transition:all .3s; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    .toast.error   { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="/teacher-discovery" class="text-gray-500 hover:text-primary-600 transition-colors"><i class="fas fa-arrow-left"></i></a>
      <h1 class="text-lg font-semibold text-gray-900 font-display">My Connection Requests</h1>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-8">

    <!-- Loading -->
    <div id="loadingState" class="text-center py-16 text-gray-400">
      <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-primary-400"></i>
      <p>Loading your requests…</p>
    </div>

    <!-- Empty -->
    <div id="emptyState" class="hidden text-center py-16 text-gray-400">
      <i class="fas fa-paper-plane text-5xl mb-4 opacity-30"></i>
      <p class="text-lg font-medium">No requests yet</p>
      <p class="text-sm mt-1">Go to <a href="/teacher-discovery" class="text-primary-500 underline">Find a Teacher</a> to send your first request.</p>
    </div>

    <!-- Request list -->
    <div id="requestList" class="hidden space-y-4"></div>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    document.addEventListener("DOMContentLoaded", loadRequests);

    async function loadRequests() {
      try {
        const res = await fetch("/api/connections/student/my-requests", { credentials:"same-origin" });
        if (!res.ok) throw new Error();
        const d = await res.json();
        renderRequests(d.requests || []);
      } catch (_) {
        renderRequests([]); // show empty
      }
    }

    function renderRequests(requests) {
      document.getElementById("loadingState").classList.add("hidden");
      const list = document.getElementById("requestList");
      if (!requests.length) { document.getElementById("emptyState").classList.remove("hidden"); return; }
      list.classList.remove("hidden");
      list.innerHTML = requests.map(r => requestCardHtml(r)).join("");
    }

    function requestCardHtml(r) {
      const statusClass = { pending:"status-pending", accepted:"status-accepted", rejected:"status-rejected" }[r.status] || "status-pending";
      const statusLabel = { pending:"Pending", accepted:"Accepted", rejected:"Rejected" }[r.status] || r.status;
      const statusIcon  = { pending:"clock", accepted:"check-circle", rejected:"times-circle" }[r.status] || "clock";
      const initials = ((r.teacher_first_name||"?")[0]+(r.teacher_last_name||"?")[0]).toUpperCase();

      return `
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center text-white font-bold text-base flex-shrink-0">
              ${initials}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2 flex-wrap">
                <p class="font-semibold text-gray-900">${escHtml(r.teacher_first_name||"")} ${escHtml(r.teacher_last_name||"")}</p>
                <span class="status-badge ${statusClass}"><i class="fas fa-${statusIcon}"></i>${statusLabel}</span>
              </div>
              <p class="text-sm text-gray-500 mt-0.5">Subject: <span class="font-medium text-gray-700">${escHtml(r.subject||"")}</span></p>
              ${r.message ? `<p class="text-sm text-gray-600 mt-2 italic">"${escHtml(r.message)}"</p>` : ""}
              ${r.rejection_reason ? `<div class="mt-2 p-3 bg-red-50 rounded-lg"><p class="text-sm text-red-700"><i class="fas fa-info-circle mr-1"></i>${escHtml(r.rejection_reason)}</p></div>` : ""}
              <p class="text-xs text-gray-400 mt-2">${formatDate(r.created_at)}</p>
            </div>
          </div>
          ${r.status === "pending" ? `
            <div class="mt-4 flex justify-end">
              <button onclick="cancelRequest(${r.id}, this)"
                class="px-4 py-2 text-sm border border-red-200 text-red-600 rounded-lg hover:bg-red-50 transition-colors font-medium">
                <i class="fas fa-times mr-1.5"></i>Cancel Request
              </button>
            </div>` : ""}
          ${r.status === "accepted" ? `
            <div class="mt-4 p-3 bg-green-50 rounded-lg text-sm text-green-700">
              <i class="fas fa-check-circle mr-1.5"></i>Your teacher accepted! You can now access their lessons.
            </div>` : ""}
        </div>
      `;
    }

    async function cancelRequest(id, btn) {
      if (!confirm("Cancel this connection request?")) return;
      btn.disabled = true;
      try {
        const res = await fetch(`/api/connections/student/request/${id}`, {
          method:"DELETE", credentials:"same-origin",
        });
        if (res.ok) { showToast("Request cancelled."); loadRequests(); }
        else { const d=await res.json().catch(()=>({})); showToast(d.error||"Failed to cancel.", "error"); btn.disabled=false; }
      } catch (_) { showToast("Network error.", "error"); btn.disabled=false; }
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleDateString("en-PK", { year:"numeric", month:"short", day:"numeric" });
    }
    function escHtml(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function showToast(msg, type="success") {
      const t=document.getElementById("toast");
      t.className=`toast ${type}`;
      t.innerHTML=`<i class="fas fa-${type==="success"?"check-circle":"exclamation-circle"}"></i> ${msg}`;
      t.classList.add("show");
      setTimeout(()=>t.classList.remove("show"),3500);
    }
  </script>
</body>
</html>
