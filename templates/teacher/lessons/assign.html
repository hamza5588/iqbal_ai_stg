{# Assign Lesson to Class — mirrors quizzes/assign.html (POST /api/lms/lesson-assignments/publish-to-class). #}
<div class="td-card accent" id="tdAssignLessonCard" hidden>
  <div class="td-section-title">
    <div class="td-icon-badge"><i class="fas fa-users"></i></div>
    <div>
      <h2>Assign &amp; Publish Lesson</h2>
      <p>Select the class that should receive this lesson, then publish — same flow as quizzes.</p>
    </div>
  </div>
  <form id="lmsLessonAssignForm" onsubmit="submitLmsLessonAssignment(event)" data-wait-message="Publishing lesson to class...">
    <input type="hidden" id="lmsLessonAssignLessonId" value="">
    <div class="td-form-grid">
      <div class="td-field">
        <label for="lmsLessonAssignTitle">Assignment title <span class="req">*</span></label>
        <input id="lmsLessonAssignTitle" type="text" required placeholder="e.g. Week 3 Lesson">
      </div>
      <div class="td-field">
        <label for="lmsLessonAssignClass">Class <span class="req">*</span></label>
        <select id="lmsLessonAssignClass" required></select>
      </div>
      <div class="td-field">
        <label for="lmsLessonAssignLessonLabel">Lesson</label>
        <input id="lmsLessonAssignLessonLabel" type="text" readonly>
      </div>
      <div class="td-field">
        <label for="lmsLessonAssignDue">Due date <span class="opt">(optional)</span></label>
        <input id="lmsLessonAssignDue" type="datetime-local">
      </div>
    </div>
    <div class="td-form-actions">
      <button type="button" class="td-btn td-btn-outline" onclick="closeLmsLessonAssignModal()">Cancel</button>
      <button type="submit" id="lmsLessonAssignSubmitBtn" class="td-btn td-btn-primary">Assign &amp; Publish</button>
    </div>
  </form>
  <div id="lmsLessonAssignStatus" class="td-status-line"></div>
</div>
