<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-Lecture | Iqbal AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='teacher/css/theme-colors.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='teacher/css/markdown-styles.css') }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode:"class",
      theme:{ extend:{
        fontFamily:{ sans:["Inter","system-ui","sans-serif"], display:["Poppins","Inter","sans-serif"] },
        colors:{
          primary:{50:"#f0f9ff",100:"#e0f2fe",200:"#bae6fd",500:"#0ea5e9",600:"#0284c7"},
          accent: {50:"#fdf2f8",500:"#ec4899",600:"#db2777"},
          success:{50:"#f0fdf4",500:"#22c55e",600:"#16a34a"},
          error:  {50:"#fef2f2",500:"#ef4444"},
          warning:{50:"#fffbeb",500:"#f59e0b"},
        },
      }},
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@14/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { -webkit-font-smoothing:antialiased; }
    textarea:focus, input:focus { outline:none; border-color:#0ea5e9; box-shadow:0 0 0 3px rgba(14,165,233,.15); }
    .student-chip { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:9999px; background:#e0f2fe; color:#0369a1; font-size:.8rem; cursor:pointer; border:1.5px solid #bae6fd; transition:all .2s; }
    .student-chip.selected { background:#0ea5e9; color:white; border-color:#0ea5e9; }
    .toast { position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999; padding:.85rem 1.25rem; border-radius:.75rem; font-size:.875rem; font-weight:500; display:flex; align-items:center; gap:.5rem; box-shadow:0 8px 24px rgba(0,0,0,.15); transform:translateY(100px); opacity:0; transition:all .3s; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    .toast.error   { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .toast.info    { background:#f0f9ff; color:#0369a1; border:1px solid #bae6fd; }
    .score-pill { padding:3px 10px; border-radius:9999px; font-size:.75rem; font-weight:600; }
    .score-high { background:#d1fae5; color:#065f46; }
    .score-med  { background:#fef3c7; color:#92400e; }
    .score-low  { background:#fee2e2; color:#991b1b; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

  <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/next-day-review" class="text-gray-500 hover:text-primary-600 transition-colors"><i class="fas fa-arrow-left"></i></a>
        <h1 class="text-lg font-semibold text-gray-900 font-display">Mini-Lecture</h1>
      </div>
      <div class="flex gap-2">
        <button onclick="saveDraft()" class="px-3 py-2 text-sm border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 font-medium">
          <i class="fas fa-save mr-1.5"></i>Save Draft
        </button>
        <button onclick="publishMiniLecture()"
          class="px-4 py-2 text-sm bg-gradient-to-r from-accent-500 to-accent-600 text-white rounded-lg font-medium hover:shadow-md transition-all">
          <i class="fas fa-paper-plane mr-1.5"></i>Publish to Students
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Editor column -->
      <div class="lg:col-span-2 space-y-6">

        <!-- Meta -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Mini-Lecture Title <span class="text-red-500">*</span></label>
              <input id="miniTitle" type="text" placeholder="e.g. Quick recap of Newton's Laws"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm transition-all" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Related Lesson</label>
              <select id="relatedLesson" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm bg-white transition-all">
                <option value="">Select lesson (optional)</option>
              </select>
            </div>
            <div class="sm:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">Focus / Objective</label>
              <input id="miniObjective" type="text" placeholder="What concept does this mini-lecture address?"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm transition-all" />
            </div>
          </div>
        </div>

        <!-- Content editor -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="border-b border-gray-200 px-4 py-2 flex items-center gap-1">
            <button onclick="mfmt('bold')"   class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 text-gray-600"><i class="fas fa-bold text-xs"></i></button>
            <button onclick="mfmt('italic')" class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 text-gray-600"><i class="fas fa-italic text-xs"></i></button>
            <button onclick="mfmt('h3')"     class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 text-gray-600"><i class="fas fa-heading text-xs"></i></button>
            <button onclick="mfmt('ul')"     class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 text-gray-600"><i class="fas fa-list-ul text-xs"></i></button>
            <div class="flex ml-2 gap-1">
              <button onclick="setMiniMode('edit')" id="mMode1" class="px-2 py-1 text-xs rounded bg-primary-500 text-white">Edit</button>
              <button onclick="setMiniMode('preview')" id="mMode2" class="px-2 py-1 text-xs rounded bg-gray-100 text-gray-600">Preview</button>
            </div>
          </div>
          <div id="miniEditPane">
            <textarea id="miniContent" rows="14" placeholder="Write the mini-lecture content in Markdown…"
              class="w-full px-5 py-4 text-sm border-none resize-none focus:outline-none"
              oninput="onMiniInput()"></textarea>
          </div>
          <div id="miniPreviewPane" class="hidden px-5 py-4 min-h-48">
            <div id="miniPreviewContent" class="markdown-content prose max-w-none text-sm"></div>
          </div>
        </div>

        <!-- AI Assist -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <h3 class="text-sm font-semibold text-gray-900 mb-3 flex items-center gap-2">
            <i class="fas fa-robot text-primary-500"></i> AI Assist
          </h3>
          <div class="flex gap-2">
            <input id="aiAssistInput" type="text" placeholder="Ask AI to help expand, simplify, or add examples…"
              class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm transition-all"
              onkeydown="if(event.key==='Enter')askMiniAI()" />
            <button onclick="askMiniAI()" id="aiAssistBtn"
              class="px-4 py-2.5 bg-primary-500 text-white rounded-xl text-sm font-medium hover:bg-primary-600 transition-colors">
              Ask AI
            </button>
          </div>
          <div id="aiAssistResult" class="hidden mt-3 p-3 bg-primary-50 rounded-xl border border-primary-100">
            <p class="text-xs font-semibold text-primary-600 mb-2"><i class="fas fa-robot mr-1"></i>AI Suggestion</p>
            <div id="aiAssistContent" class="text-sm text-gray-700 markdown-content prose max-w-none"></div>
            <button onclick="applyAiSuggestion()"
              class="mt-2 text-xs text-primary-500 hover:underline font-medium">
              <i class="fas fa-plus mr-1"></i>Apply to mini-lecture
            </button>
          </div>
        </div>
      </div>

      <!-- Right column: Students -->
      <div class="space-y-6">

        <!-- Target students -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <h3 class="text-sm font-semibold text-gray-900 mb-1 flex items-center gap-2">
            <i class="fas fa-users text-accent-500"></i> Target Students
          </h3>
          <p class="text-xs text-gray-500 mb-3">Select which students receive this mini-lecture.</p>

          <div class="flex items-center justify-between mb-2">
            <button onclick="selectAll()" class="text-xs text-primary-500 hover:underline">Select all</button>
            <button onclick="clearAll()" class="text-xs text-gray-400 hover:underline">Clear</button>
          </div>

          <div class="mb-2">
            <input id="studentSearch" type="text" placeholder="Search students…"
              class="w-full px-3 py-2 border border-gray-200 rounded-lg text-xs transition-all" oninput="filterStudents()" />
          </div>

          <div id="studentList" class="flex flex-wrap gap-2 max-h-64 overflow-y-auto">
            <p class="text-xs text-gray-400">Loading students…</p>
          </div>

          <div class="mt-3 flex items-center gap-2 text-xs text-gray-500">
            <i class="fas fa-check-circle text-success-500"></i>
            <span><span id="selectedCount">0</span> students selected</span>
          </div>
        </div>

        <!-- Scores (if available) -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <h3 class="text-sm font-semibold text-gray-900 mb-3 flex items-center gap-2">
            <i class="fas fa-chart-bar text-warning-500"></i> Student Performance
          </h3>
          <p class="text-xs text-gray-500 mb-2">Students needing the most support:</p>
          <div id="studentScores" class="space-y-2">
            <p class="text-xs text-gray-400">No performance data available.</p>
          </div>
        </div>

        <!-- Publish settings -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <h3 class="text-sm font-semibold text-gray-900 mb-3 flex items-center gap-2">
            <i class="fas fa-cog text-gray-400"></i> Publish Settings
          </h3>
          <label class="flex items-center gap-2 mb-2 cursor-pointer">
            <input type="checkbox" id="notifyStudents" class="w-4 h-4 text-primary-500" checked />
            <span class="text-sm text-gray-700">Notify selected students</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="hideFromOthers" class="w-4 h-4 text-primary-500" checked />
            <span class="text-sm text-gray-700">Hide from other students</span>
          </label>
        </div>

      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const LESSON_ID = {{ lesson_id | default(0) }};
    let miniLessonId = null;
    let allStudents = [];
    let selectedStudents = new Set();
    let lastAiSuggestion = "";

    document.addEventListener("DOMContentLoaded", () => {
      loadLessons();
      loadStudents();
      if (LESSON_ID) {
        document.getElementById("relatedLesson").value = LESSON_ID;
        loadExistingMiniLecture();
      }
    });

    // -----------------------------------------------------------------------
    // Loaders
    // -----------------------------------------------------------------------
    async function loadLessons() {
      try {
        const res = await fetch("/api/lessons?role=teacher&limit=20", { credentials:"same-origin" });
        if (!res.ok) return;
        const d = await res.json();
        const sel = document.getElementById("relatedLesson");
        (d.lessons||d).forEach(l => { const o=document.createElement("option"); o.value=l.id; o.textContent=l.title||`Lesson #${l.id}`; sel.appendChild(o); });
      } catch (_) {}
    }

    async function loadStudents() {
      try {
        const res = await fetch("/api/teacher/students", { credentials:"same-origin" });
        if (!res.ok) throw new Error();
        const d = await res.json();
        allStudents = d.students || [];
        renderStudents(allStudents);
        renderStudentScores(allStudents);
      } catch (_) {
        // Demo data
        allStudents = [
          { id:1, first_name:"Zainab", last_name:"Ali",    score:0.45 },
          { id:2, first_name:"Ahmed",  last_name:"Hassan", score:0.62 },
          { id:3, first_name:"Fatima", last_name:"Khan",   score:0.38 },
          { id:4, first_name:"Omar",   last_name:"Sheikh", score:0.75 },
          { id:5, first_name:"Sara",   last_name:"Malik",  score:0.55 },
        ];
        renderStudents(allStudents);
        renderStudentScores(allStudents);
      }
    }

    async function loadExistingMiniLecture() {
      try {
        const res = await fetch(`/api/lessons/${LESSON_ID}/mini-lecture`, { credentials:"same-origin" });
        if (!res.ok) return;
        const d = await res.json();
        if (d.mini_lesson_id) miniLessonId = d.mini_lesson_id;
        if (d.title)   document.getElementById("miniTitle").value   = d.title;
        if (d.content) document.getElementById("miniContent").value = d.content;
        if (d.target_student_ids) d.target_student_ids.forEach(id => selectedStudents.add(id));
        renderStudents(allStudents);
        updateSelectedCount();
      } catch (_) {}
    }

    // -----------------------------------------------------------------------
    // Students
    // -----------------------------------------------------------------------
    function renderStudents(students) {
      const list = document.getElementById("studentList");
      if (!students.length) { list.innerHTML = `<p class="text-xs text-gray-400">No students found.</p>`; return; }
      list.innerHTML = students.map(s => `
        <button class="student-chip ${selectedStudents.has(s.id)?"selected":""}" onclick="toggleStudent(${s.id}, this)">
          <span>${escHtml(s.first_name)} ${escHtml(s.last_name)}</span>
        </button>
      `).join("");
    }

    function renderStudentScores(students) {
      const sorted = [...students].sort((a,b)=>(a.score||0)-(b.score||0)).slice(0,5);
      const cont = document.getElementById("studentScores");
      if (!sorted.length) return;
      cont.innerHTML = sorted.map(s => {
        const pct = Math.round((s.score||0)*100);
        const cls = pct<50?"score-low":pct<70?"score-med":"score-high";
        return `
          <div class="flex items-center justify-between">
            <span class="text-xs text-gray-700">${escHtml(s.first_name)} ${escHtml(s.last_name)}</span>
            <span class="score-pill ${cls}">${pct}%</span>
          </div>
        `;
      }).join("");
    }

    function toggleStudent(id, btn) {
      if (selectedStudents.has(id)) { selectedStudents.delete(id); btn.classList.remove("selected"); }
      else { selectedStudents.add(id); btn.classList.add("selected"); }
      updateSelectedCount();
    }

    function selectAll() { allStudents.forEach(s=>selectedStudents.add(s.id)); renderStudents(allStudents); updateSelectedCount(); }
    function clearAll()  { selectedStudents.clear(); renderStudents(allStudents); updateSelectedCount(); }
    function updateSelectedCount() { document.getElementById("selectedCount").textContent = selectedStudents.size; }

    function filterStudents() {
      const q = document.getElementById("studentSearch").value.toLowerCase();
      renderStudents(allStudents.filter(s=>`${s.first_name} ${s.last_name}`.toLowerCase().includes(q)));
    }

    // -----------------------------------------------------------------------
    // Editor
    // -----------------------------------------------------------------------
    function onMiniInput() {
      if (document.getElementById("miniPreviewPane").style.display !== "none" && !document.getElementById("miniPreviewPane").classList.contains("hidden")) {
        updateMiniPreview();
      }
    }

    function updateMiniPreview() {
      const md = document.getElementById("miniContent").value;
      document.getElementById("miniPreviewContent").innerHTML = DOMPurify.sanitize(marked.parse(md));
    }

    function setMiniMode(mode) {
      if (mode==="edit") {
        document.getElementById("miniEditPane").classList.remove("hidden");
        document.getElementById("miniPreviewPane").classList.add("hidden");
        document.getElementById("mMode1").className = "px-2 py-1 text-xs rounded bg-primary-500 text-white";
        document.getElementById("mMode2").className = "px-2 py-1 text-xs rounded bg-gray-100 text-gray-600";
      } else {
        updateMiniPreview();
        document.getElementById("miniEditPane").classList.add("hidden");
        document.getElementById("miniPreviewPane").classList.remove("hidden");
        document.getElementById("mMode1").className = "px-2 py-1 text-xs rounded bg-gray-100 text-gray-600";
        document.getElementById("mMode2").className = "px-2 py-1 text-xs rounded bg-primary-500 text-white";
      }
    }

    function mfmt(type) {
      const ta = document.getElementById("miniContent");
      const s  = ta.selectionStart, e = ta.selectionEnd;
      const sel = ta.value.slice(s,e);
      const pre = ta.value.slice(0,s), post = ta.value.slice(e);
      const map = { bold:`**${sel||"bold"}**`, italic:`*${sel||"italic"}*`, h3:`\n### ${sel||"Heading"}\n`, ul:`\n- ${sel||"item"}\n` };
      if (!map[type]) return;
      ta.value = pre + map[type] + post;
      ta.focus();
    }

    // -----------------------------------------------------------------------
    // AI Assist
    // -----------------------------------------------------------------------
    async function askMiniAI() {
      const q = document.getElementById("aiAssistInput").value.trim();
      if (!q) return;
      const btn = document.getElementById("aiAssistBtn");
      btn.disabled = true; btn.textContent = "…";

      try {
        const context = document.getElementById("miniContent").value.slice(0,1500);
        const res = await fetch("/chat", {
          method:"POST", credentials:"same-origin",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ input: q, context: `[Mini-Lecture Context]\n${context}\n\n` }),
        });
        const d = await res.json();
        lastAiSuggestion = d.response || d.message || "";
        document.getElementById("aiAssistContent").innerHTML = DOMPurify.sanitize(marked.parse(lastAiSuggestion));
        document.getElementById("aiAssistResult").classList.remove("hidden");
      } catch (_) { showToast("AI error.", "error"); }
      finally { btn.disabled=false; btn.textContent="Ask AI"; }
    }

    function applyAiSuggestion() {
      const ta = document.getElementById("miniContent");
      ta.value += "\n\n" + lastAiSuggestion;
      document.getElementById("aiAssistResult").classList.add("hidden");
      showToast("Suggestion applied!", "success");
    }

    // -----------------------------------------------------------------------
    // Save / Publish
    // -----------------------------------------------------------------------
    async function saveDraft() {
      const title = document.getElementById("miniTitle").value.trim();
      if (!title) { showToast("Please enter a title.", "error"); return; }

      const payload = {
        title,
        content: document.getElementById("miniContent").value,
        objective: document.getElementById("miniObjective").value.trim(),
        related_lesson_id: document.getElementById("relatedLesson").value || null,
        target_student_ids: [...selectedStudents],
        status: "draft",
      };
      if (miniLessonId) payload.mini_lesson_id = miniLessonId;

      try {
        const res = await fetch("/api/mini-lectures", {
          method:"POST", credentials:"same-origin",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify(payload),
        });
        if (res.ok) {
          const out = await res.json().catch(() => ({}));
          if (out.mini_lesson_id) miniLessonId = out.mini_lesson_id;
          showToast("Draft saved!", "success");
        }
        else { const d=await res.json().catch(()=>({})); showToast(d.error||"Save failed.", "error"); }
      } catch (_) { showToast("Network error.", "error"); }
    }

    async function publishMiniLecture() {
      if (!selectedStudents.size) { showToast("Please select at least one student.", "error"); return; }
      const title = document.getElementById("miniTitle").value.trim();
      if (!title) { showToast("Please enter a title.", "error"); return; }

      const payload = {
        title,
        content: document.getElementById("miniContent").value,
        objective: document.getElementById("miniObjective").value.trim(),
        related_lesson_id: document.getElementById("relatedLesson").value || null,
        target_student_ids: [...selectedStudents],
        notify_students: document.getElementById("notifyStudents").checked,
        hide_from_others: document.getElementById("hideFromOthers").checked,
        status: "published",
      };
      if (miniLessonId) payload.mini_lesson_id = miniLessonId;

      try {
        const res = await fetch("/api/mini-lectures/publish", {
          method:"POST", credentials:"same-origin",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify(payload),
        });
        if (res.ok) {
          const out = await res.json().catch(() => ({}));
          if (out.mini_lesson_id) miniLessonId = out.mini_lesson_id;
          showToast(`Published to ${selectedStudents.size} student${selectedStudents.size>1?"s":""}!`, "success");
        } else {
          const d=await res.json().catch(()=>({}));
          showToast(d.error||"Publish failed.", "error");
        }
      } catch (_) { showToast("Network error.", "error"); }
    }

    function escHtml(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function showToast(msg, type="success") {
      const t=document.getElementById("toast");
      t.className=`toast ${type}`;
      t.innerHTML=`<i class="fas fa-${type==="success"?"check-circle":type==="info"?"info-circle":"exclamation-circle"}"></i> ${msg}`;
      t.classList.add("show");
      setTimeout(()=>t.classList.remove("show"),3500);
    }
  </script>
</body>
</html>
