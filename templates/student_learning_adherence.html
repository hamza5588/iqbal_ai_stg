<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan adherence | Iqbal AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-8">
    <a href="/student-learning" class="text-sm text-sky-600 hover:underline">← Learning hub</a>
    <h1 class="text-2xl font-bold text-slate-800 mt-2">Plan adherence</h1>
    <p class="text-slate-600 text-sm mb-4">Log today and review recent days.</p>
    <div class="bg-white p-4 rounded-xl border border-slate-200 mb-6">
      <h2 class="font-semibold text-slate-800 mb-2">Log today</h2>
      <div class="grid sm:grid-cols-2 gap-2 text-sm">
        <label>Planned minutes <input id="planned" type="number" class="w-full border rounded px-2 py-1" /></label>
        <label>Actual minutes <input id="actual" type="number" class="w-full border rounded px-2 py-1" /></label>
      </div>
      <label class="flex items-center gap-2 mt-2 text-sm"><input type="checkbox" id="missed" /> Missed</label>
      <button id="log" class="mt-2 px-4 py-2 bg-sky-600 text-white rounded-lg text-sm">Save day</button>
    </div>
    <pre id="hist" class="text-xs bg-slate-900 text-green-400 p-3 rounded-lg overflow-auto max-h-96"></pre>
  </div>
  <script>
    function loadHist() {
      fetch("/api/phase3/adherence/history", { credentials: "same-origin" })
        .then(r => r.json())
        .then(d => { document.getElementById("hist").textContent = JSON.stringify(d.items || [], null, 2); });
    }
    document.getElementById("log").onclick = () => {
      fetch("/api/phase3/adherence", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          planned_minutes: document.getElementById("planned").value ? parseInt(document.getElementById("planned").value, 10) : null,
          actual_minutes: document.getElementById("actual").value ? parseInt(document.getElementById("actual").value, 10) : null,
          missed: document.getElementById("missed").checked,
        }),
      }).then(() => loadHist());
    };
    loadHist();
  </script>
</body>
</html>
