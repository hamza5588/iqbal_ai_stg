<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery tips | Print</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>@media print { .no-print { display: none; } }</style>
</head>
<body class="bg-white text-slate-800">
  <div class="max-w-3xl mx-auto px-4 py-8">
    <div class="no-print mb-4 flex gap-2">
      <button onclick="window.print()" class="px-4 py-2 bg-sky-600 text-white rounded-lg text-sm">Print / Save PDF</button>
      <a href="/lecture-editor/{{ lesson_id }}" class="px-4 py-2 border rounded-lg text-sm">Back to editor</a>
    </div>
    <h1 class="text-2xl font-bold mb-2">Delivery tips</h1>
    <p class="text-sm text-slate-500 mb-6">Lesson #{{ lesson_id }}</p>
    <div id="root" class="prose max-w-none border rounded-xl p-4 min-h-[200px]">Loading…</div>
  </div>
  <script>
    const lessonId = {{ lesson_id|tojson }};
    fetch(`/api/lessons/${lessonId}/delivery-guidance`, { credentials: "same-origin" })
      .then(r => r.json())
      .then(d => {
        const el = document.getElementById("root");
        const payload = d.payload || d.payload_json || d;
        el.innerHTML = "<pre class='whitespace-pre-wrap text-sm'>" + JSON.stringify(payload, null, 2) + "</pre>";
      })
      .catch(() => { document.getElementById("root").textContent = "Could not load delivery guidance."; });
  </script>
</body>
</html>
