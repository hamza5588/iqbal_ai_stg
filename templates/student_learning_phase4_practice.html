<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice queue | Iqbal AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6 max-w-xl mx-auto">
  <a href="/student-learning" class="text-sm text-sky-600">&larr; Hub</a>
  <h1 class="text-xl font-bold mt-4">Practice</h1>
  <p class="text-sm text-slate-600 mb-4">Queue next question, start timer, submit with confidence 1–5 before result.</p>
  <button id="next" class="px-4 py-2 bg-sky-600 text-white rounded-lg text-sm">Load next from queue</button>
  <div id="q" class="mt-4 p-4 bg-white border rounded-xl text-sm hidden"></div>
  <div id="form" class="mt-4 space-y-2 hidden">
    <label class="text-sm">Confidence (1–5) <input type="number" id="conf" min="1" max="5" value="3" class="border rounded px-2" /></label>
    <label class="text-sm block">Correct? <select id="ok" class="border rounded px-2"><option value="true">Yes</option><option value="false">No</option></select></label>
    <button id="go" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm">Submit</button>
  </div>
  <pre id="log" class="text-xs mt-4 bg-slate-900 text-green-400 p-3 rounded-lg overflow-auto max-h-48"></pre>
  {% include 'partials/phase4_floating.html' %}
  <script>
    let attemptId = null;
    let qid = null;
    document.getElementById("next").onclick = () => {
      fetch("/api/phase4/queue/next", { credentials: "same-origin" })
        .then(r => r.json())
        .then(d => {
          document.getElementById("log").textContent = JSON.stringify(d, null, 2);
          if (!d.item || !d.item.question) { alert("Queue empty — enqueue items from question bank first."); return; }
          qid = d.item.question.id;
          document.getElementById("q").classList.remove("hidden");
          document.getElementById("q").textContent = d.item.question.stem;
          return fetch("/api/phase4/practice/start", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question_bank_item_id: qid, queue_item_id: d.item.queue.id }) });
        })
        .then(r => r && r.json())
        .then(d => { if (d && d.id) { attemptId = d.id; document.getElementById("form").classList.remove("hidden"); } })
        .catch(() => alert("Error"));
    };
    document.getElementById("go").onclick = () => {
      if (!attemptId) return;
      const body = { confidence_before_result: parseInt(document.getElementById("conf").value, 10), is_correct: document.getElementById("ok").value === "true", response: { selected: "A" }, correct: "A" };
      fetch("/api/phase4/practice/" + attemptId + "/submit", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
        .then(r => r.json())
        .then(d => { document.getElementById("log").textContent = JSON.stringify(d, null, 2); document.getElementById("form").classList.add("hidden"); })
        .catch(() => alert("submit failed"));
    };
  </script>
</body>
</html>
