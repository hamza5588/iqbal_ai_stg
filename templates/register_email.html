<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - Step 1 | Iqbal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: Inter, system-ui, sans-serif; }
      .gradient-text { background: linear-gradient(135deg, #0ea5e9, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .glass-morphism { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
    </style>
  </head>
  <body class="min-h-screen flex flex-col lg:flex-row bg-gradient-to-br from-slate-50 to-white">
    <!-- Left panel (same style as login) -->
    <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-sky-900 via-sky-800 to-slate-900 p-8 lg:p-12 flex-col justify-center">
      <div class="flex items-center space-x-3 mb-12">
        <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center">
          <img src="{{ url_for('static', filename='images/logo.png') }}" class="w-8 h-8" alt="IQBAL AI" />
        </div>
        <div>
          <h1 class="text-2xl font-bold text-white font-display">IQBAL AI</h1>
          <p class="text-sky-200 text-sm">Intelligent Learning Platform</p>
        </div>
      </div>
      <h2 class="text-4xl font-bold text-white mb-4">Create your account</h2>
      <p class="text-sky-100 text-lg">Enter your email and we’ll send you a verification link to complete registration.</p>
    </div>
    <!-- Right panel - form -->
    <div class="flex-1 flex flex-col justify-center p-6 lg:p-12">
      <div class="w-full max-w-md mx-auto">
        <div class="lg:hidden text-center mb-6">
          <img src="{{ url_for('static', filename='images/logo.png') }}" class="w-16 h-16 mx-auto mb-2" alt="IQBAL AI" />
          <h1 class="text-xl font-bold text-gray-900">IQBAL AI</h1>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Step 1 – Verify email</h2>
        <p class="text-gray-600 text-sm mb-6">We’ll send a verification link to your email.</p>
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">{{ error }}</div>
        {% endif %}
        <form action="{{ url_for('auth.register_email') }}" method="POST" id="registerEmailForm" class="glass-morphism rounded-2xl p-8 border border-gray-200 shadow-xl space-y-4">
          <div>
            <label for="useremail" class="block text-gray-700 font-semibold mb-2">Email address</label>
            <input type="email" id="useremail" name="useremail" required placeholder="you@example.com"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-sky-500 focus:border-sky-500" />
          </div>
          <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 rounded-xl transition">
            Send verification email
          </button>
        </form>
        <p class="text-center mt-6 text-gray-600 text-sm">
          Already have an account? <a href="{{ url_for('auth.login') }}" class="text-sky-600 hover:text-sky-700 font-medium">Sign in</a>
        </p>
      </div>
    </div>
  </body>
</html>
