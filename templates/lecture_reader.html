<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lecture reader | Iqbal AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='teacher/css/markdown-styles.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="bg-slate-100">
  <header class="sticky top-0 z-20 bg-white border-b border-slate-200 px-4 py-3 flex flex-wrap items-center justify-between gap-2">
    <a href="/student-learning" class="text-slate-500 hover:text-sky-600 text-sm"><i class="fas fa-arrow-left"></i> Hub</a>
    <div class="flex items-center gap-2 text-sm">
      <label class="text-slate-600">Mode</label>
      <select id="modeSel" class="border rounded-lg px-2 py-1">
        <option value="lecture">Lecture (assigned)</option>
        <option value="self_study">Self-study</option>
      </select>
      <button id="ttsBtn" type="button" class="px-3 py-1 rounded-lg bg-slate-800 text-white text-xs">Voice (TTS)</button>
    </div>
  </header>
  <div class="max-w-6xl mx-auto flex flex-col lg:flex-row gap-4 p-4">
    <article id="contentPane" class="flex-1 bg-white rounded-xl border border-slate-200 p-4 prose max-w-none min-h-[50vh]">
      <p class="text-slate-500">Loading lecture…</p>
    </article>
    <aside class="w-full lg:w-96 flex flex-col gap-3">
      <section class="bg-white rounded-xl border border-slate-200 p-3">
        <h3 class="text-sm font-semibold text-slate-700 mb-2">Ask AI</h3>
        <textarea id="q" rows="3" class="w-full border rounded-lg p-2 text-sm" placeholder="Explain: …"></textarea>
        <div class="flex gap-2 mt-2">
          <button id="askBtn" class="flex-1 bg-sky-600 text-white rounded-lg py-2 text-sm font-medium">Send</button>
          <button id="micBtn" type="button" class="px-3 border rounded-lg text-slate-600" title="Speech-to-text"><i class="fas fa-microphone"></i></button>
        </div>
        <div id="ans" class="mt-3 text-sm text-slate-700 border-t pt-2 max-h-64 overflow-auto"></div>
      </section>
      <section class="bg-white rounded-xl border border-slate-200 p-3 text-xs text-slate-600">
        <strong>Study meter</strong>
        <pre id="meter" class="mt-1 whitespace-pre-wrap font-mono text-[11px]"></pre>
      </section>
    </aside>
  </div>
  <audio id="ttsAudio" class="hidden"></audio>
  <script src="{{ url_for('static', filename='js/phase3/lecture_reader.js') }}"></script>
</body>
</html>
