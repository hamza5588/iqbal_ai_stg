

user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Optional: better debugging for rate-limit / real IP issues
    log_format custom '$remote_addr - xff:$http_x_forwarded_for - realip:$realip_remote_addr - '
                      'key:"$rate_limit_key" req:"$request" status:$status';
    access_log /var/log/nginx/access.log custom;

    # Upload size
    client_max_body_size 100M;

    # Global request timeouts
    client_body_timeout 1800s;
    send_timeout        1800s;

    # ---------------------------------------------------------------
    # REAL IP HANDLING
    # ---------------------------------------------------------------
    # Agar nginx ke samne load balancer / reverse proxy / Cloudflare hai,
    # to neeche trusted proxy IPs/subnets add karo.
    #
    # EXAMPLES:
    # set_real_ip_from 172.16.0.0/12;
    # set_real_ip_from 10.0.0.0/8;
    # set_real_ip_from 192.168.0.0/16;
    #
    # Agar koi external LB hai to uska exact IP/subnet yahan do.
    #
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ---- replace these with your actual trusted proxy/LB networks ----
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    # set_real_ip_from <YOUR_LOAD_BALANCER_IP_OR_SUBNET>;

    # ---------------------------------------------------------------
    # RATE-LIMIT KEY
    # Whitelisted IPs => empty key => no throttling
    # ---------------------------------------------------------------
    geo $rate_limit_key {
        default                $binary_remote_addr;
        127.0.0.1              "";
        104.219.55.160         "";   # staging load-test server IP
    }

    # ---------------------------------------------------------------
    # RATE-LIMIT ZONES
    # Separate limits for general traffic and heavy RAG endpoints
    # ---------------------------------------------------------------
    limit_req_zone $rate_limit_key zone=general_limit:10m rate=50r/s;
    limit_req_zone $rate_limit_key zone=rag_ingest_limit:10m rate=120r/s;
    limit_req_zone $rate_limit_key zone=rag_chat_limit:10m rate=80r/s;

    upstream staging_upstream {
        server iqbal_ai_stg-nginx-1:80;
        keepalive 64;
    }

    # Shared proxy headers / timeouts
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------------------------------------------------------
    # HTTP
    # ---------------------------------------------------------------
    server {
        listen 80;
        server_name staging.iqbalai.com;
        client_max_body_size 100M;

        # RAG ingest endpoint - higher limit
        location /api/rag/ingest {
            proxy_pass http://staging_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 1800s;
            proxy_send_timeout    1800s;
            proxy_read_timeout    1800s;

            limit_req zone=rag_ingest_limit burst=200;
            limit_req_status 429;
        }

        # RAG chat endpoint - separate higher limit
        location /api/rag/chat {
            proxy_pass http://staging_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 1800s;
            proxy_send_timeout    1800s;
            proxy_read_timeout    1800s;

            limit_req zone=rag_chat_limit burst=120;
            limit_req_status 429;
        }

        # All other traffic
        location / {
            proxy_pass http://staging_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 1800s;
            proxy_send_timeout    1800s;
            proxy_read_timeout    1800s;

            limit_req zone=general_limit burst=100;
            limit_req_status 429;
        }
    }

    # ---------------------------------------------------------------
    # HTTPS
    # ---------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name staging.iqbalai.com;
        client_max_body_size 100M;

        ssl_certificate     /etc/letsencrypt/live/iqbalai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iqbalai.com/privkey.pem;

        # RAG ingest endpoint - higher limit
        location /api/rag/ingest {
            proxy_pass http://staging_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_connect_timeout 1800s;
            proxy_send_timeout    1800s;
            proxy_read_timeout    1800s;

            limit_req zone=rag_ingest_limit burst=200;
            limit_req_status 429;
        }

        # RAG chat endpoint - separate higher limit
        location /api/rag/chat {
            proxy_pass http://staging_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_connect_timeout 1800s;
            proxy_send_timeout    1800s;
            proxy_read_timeout    1800s;

            limit_req zone=rag_chat_limit burst=120;
            limit_req_status 429;
        }

        # All other traffic
        location / {
            proxy_pass http://staging_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_connect_timeout 1800s;
            proxy_send_timeout    1800s;
            proxy_read_timeout    1800s;

            limit_req zone=general_limit burst=100;
            limit_req_status 429;
        }
    }
}



