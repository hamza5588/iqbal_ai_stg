user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
    sendfile on;
    keepalive_timeout 65;

    # Allow up to 100MB request bodies (uploads)
    client_max_body_size 100M;

    # Global request timeouts (max 1800s)
    client_body_timeout 1800s;
    send_timeout        1800s;

    # ---------------------------------------------------------------
    # Whitelisted IPs receive an empty key; nginx skips the rate-limit
    # zone entirely when the key is empty, so they are never throttled.
    # All other IPs are rate-limited normally via their binary address.
    # Add extra exempt IPs by adding lines:  x.x.x.x   "";
    # ---------------------------------------------------------------
    geo $rate_limit_key {
        default                $binary_remote_addr;
        127.0.0.1              "";   # localhost
        104.219.55.160         "";   # staging load-test server IP (whitelisted)
    }

    limit_req_zone $rate_limit_key zone=staging_limit:10m rate=10r/s;

    upstream staging_upstream {
        server iqbal_ai_stg-nginx-1:80;
    }

    # HTTP → proxy to staging
    server {
        listen 80;
        server_name staging.iqbalai.com;
        client_max_body_size 100M;

        location / {
            proxy_pass http://staging_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1800s;
            proxy_send_timeout    1800s;
            proxy_read_timeout    1800s;

            limit_req zone=staging_limit burst=20 nodelay;
            limit_req_status 429;
        }
    }

    # HTTPS → proxy to staging
    server {
        listen 443 ssl;
        server_name staging.iqbalai.com;
        client_max_body_size 100M;

        ssl_certificate     /etc/letsencrypt/live/iqbalai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iqbalai.com/privkey.pem;

        location / {
            proxy_pass http://staging_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            # Issue #2 — fixed from 60s to 1800s
            proxy_connect_timeout 1800s;
            proxy_send_timeout    1800s;
            proxy_read_timeout    1800s;

            # Issue #3 — rate limiting now applied to HTTPS traffic
            limit_req zone=staging_limit burst=20 nodelay;
            limit_req_status 429;
        }
    }
}
