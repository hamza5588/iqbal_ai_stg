user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream flask_app {
        server flask_app1:5000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;
        # Global request timeouts – extended to 1800s (30 minutes)
        client_body_timeout 1800s;
        send_timeout 1800s;

        # ----------------------------
        # Static files
        # ----------------------------
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # ----------------------------
        # WebSocket support
        # ----------------------------
        location /ws/ {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            # WebSocket read timeout – extended to 1800s
            proxy_read_timeout 1800s;
        }

        # ----------------------------
        # File uploads / Long requests
        # ----------------------------
        location ~ ^/(api/lessons/(create_lesson|create|upload)|upload|api/rag/ingest|api/ingest) {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # IMPORTANT behind gateway
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Long-running ingestion/upload requests – extended to 1800s
            proxy_connect_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;

            client_max_body_size 100M;
            proxy_buffering off;
        }

        # ----------------------------
        # Default proxy
        # ----------------------------
        location / {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # VERY IMPORTANT behind gateway
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_buffering off;
            proxy_connect_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
        }
    }
}