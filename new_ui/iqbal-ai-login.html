<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iqbal AI - Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-dark:#0e5c2f;
    --green:#1f9c46;
    --green-light:#e7f6ec;
    --green-mid:#2fae52;
    --text-dark:#16241c;
    --text-muted:#5c6b62;
    --white:#ffffff;
    --border-soft:#bfdccb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', 'Segoe UI', Arial, sans-serif;
    background:#fafdfb;
    color:var(--text-dark);
  }
  h1, h2, .brand-text .name, .join-card h2{
    font-family:'Poppins', 'Inter', sans-serif;
  }
  svg{ display:block; }

  /* Header */
  header{
    position:relative;
    background:#101314;
    height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(120deg, rgba(10,15,12,0.88), rgba(10,15,12,0.6)),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 26px);
    z-index:1;
  }
  .header-bar{
    position:relative;
    z-index:2;
    width:min(1100px, 92%);
    background:rgba(20,24,21,0.55);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:14px;
    padding:16px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    backdrop-filter:blur(4px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:#fff;
  }
  .logo-img{
    height:44px;
    width:auto;
    object-fit:contain;
  }
  .brand-text{
    display:flex;
    flex-direction:column;
    line-height:1.1;
  }
  .brand-text .name{
    font-size:1.35rem;
    font-weight:700;
    letter-spacing:0.5px;
  }
  .brand-text .name span{
    color:var(--green-mid);
  }
  .brand-text .tag{
    font-size:0.6rem;
    color:var(--green-mid);
    letter-spacing:0.5px;
    font-weight:600;
  }
  .header-actions{display:flex; gap:12px;}
  .btn{
    border:none;
    border-radius:20px;
    padding:9px 20px;
    font-size:0.85rem;
    font-weight:600;
    font-family:'Inter', sans-serif;
    letter-spacing:0.3px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn-outline{
    background:transparent;
    color:#fff;
    border:1px solid var(--green-mid);
  }
  .btn-solid{
    background:linear-gradient(90deg,var(--green-dark),var(--green-mid));
    color:#fff;
  }
  .btn:hover{ transform:translateY(-1px); opacity:0.92; }

  /* Main layout */
  main{
    display:flex;
    gap:28px;
    max-width:1160px;
    margin:-40px auto 60px;
    padding:0 20px;
    position:relative;
    z-index:3;
    flex-wrap:wrap;
    justify-content:center;
  }
  .panel{
    background:var(--green-light);
    border-radius:26px;
    padding:40px;
    flex:1 1 420px;
    max-width:520px;
    min-height:640px;
  }

  /* Left panel: sign in */
  .panel-left h1{
    font-size:1.9rem;
    font-weight:600;
    margin-bottom:22px;
  }
  .social-row{
    display:flex;
    gap:12px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .social-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1px solid #d9e4dd;
    border-radius:10px;
    padding:10px 16px;
    font-size:0.88rem;
    font-weight:600;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    color:var(--text-dark);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .social-btn:hover{ box-shadow:0 2px 8px rgba(0,0,0,0.08); transform:translateY(-1px); }
  .social-btn.linkedin{background:#0a66c2; color:#fff; border-color:#0a66c2;}

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:26px 0;
    color:var(--text-muted);
    font-size:0.75rem;
    font-weight:700;
    letter-spacing:0.5px;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#c6dccd;
  }

  label.field-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.88rem;
    font-weight:600;
    margin-bottom:8px;
    color:var(--text-dark);
  }
  .field-label .icon{color:var(--green); display:flex;}
  .field-row{ margin-bottom:20px; }
  .field-row.password .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .forgot{
    font-size:0.8rem;
    color:var(--green);
    font-weight:600;
    text-decoration:none;
    cursor:pointer;
  }
  .input-wrap{
    position:relative;
  }
  .input-wrap input{
    width:100%;
    padding:13px 42px 13px 16px;
    border-radius:10px;
    border:1.5px solid var(--border-soft);
    background:#fff;
    font-size:0.92rem;
    font-family:'Inter', sans-serif;
    outline:none;
    color:var(--text-dark);
  }
  .input-wrap input::placeholder{ color:#9fb3a7; }
  .input-wrap input:focus{
    border-color:var(--green-mid);
    box-shadow:0 0 0 3px rgba(31,156,70,0.12);
  }
  .input-wrap .input-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#9fb3a7;
    pointer-events:none;
    display:flex;
    cursor:pointer;
  }

  .options-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
    font-size:0.8rem;
    color:var(--text-muted);
  }
  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .remember input{ accent-color:var(--green); width:15px; height:15px; cursor:pointer; }
  .secure{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--green);
    font-weight:600;
  }

  .signin-btn{
    width:100%;
    background:linear-gradient(90deg,var(--green-dark),var(--green-mid));
    color:#fff;
    border:none;
    padding:15px;
    border-radius:12px;
    font-size:1rem;
    font-weight:700;
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .signin-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(31,156,70,0.35);
  }
  .footer-note{
    text-align:center;
    margin-top:22px;
    font-size:0.82rem;
    color:var(--text-muted);
    line-height:1.5;
  }
  .footer-note a{
    color:var(--green);
    font-weight:600;
    text-decoration:none;
  }

  /* Right panel: join */
  .panel-right{
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .panel-right .brand-block{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:70px;
  }
  .panel-right .brand-block .logo-img{
    height:52px;
  }

  .join-card{
    margin-top:auto;
    background:radial-gradient(120% 140% at 30% 20%, #ffffff 0%, #dff2e6 60%, #cdeeda 100%);
    border-radius:22px;
    padding:48px 36px;
    text-align:center;
    position:relative;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.6);
  }
  .join-card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:22px;
    background-image:
      linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px);
    background-size:34px 34px;
    opacity:0.5;
    pointer-events:none;
  }
  .join-card > *{ position:relative; z-index:1; }
  .join-card h2{
    font-size:2rem;
    font-weight:700;
    margin-bottom:20px;
  }
  .join-card .create-label{
    font-size:1rem;
    font-weight:600;
    margin-bottom:18px;
    color:var(--text-dark);
  }
  .join-social{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .join-social .item{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:600;
    font-size:0.9rem;
    color:var(--text-dark);
    cursor:pointer;
  }

  .divider.small{ margin:22px 0; }

  .create-account-btn{
    background:linear-gradient(90deg,var(--green-dark),var(--green-mid));
    color:#fff;
    border:none;
    padding:13px 30px;
    border-radius:20px;
    font-weight:700;
    font-family:'Inter', sans-serif;
    font-size:0.9rem;
    letter-spacing:0.3px;
    cursor:pointer;
    margin-bottom:14px;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .create-account-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(31,156,70,0.35);
  }
  .trial-note{
    font-size:0.78rem;
    color:var(--text-muted);
    line-height:1.4;
  }

  @media (max-width:900px){
    .header-bar{ flex-direction:column; gap:14px; }
    main{ margin-top:20px; }
  }
</style>
</head>
