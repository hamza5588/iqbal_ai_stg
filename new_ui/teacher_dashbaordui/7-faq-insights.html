<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frequently Asked Questions - Iqbal AI</title>
<style>
  :root{
    --green-900:#0a4a2c;
    --green-700:#2d6a47;
    --green-600:#2a9452;
    --gray-500:#6b7280;
    --gray-300:#d1d5db;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f4f6f5;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:30px;
  }
  .modal{
    width:100%;max-width:1040px;
    background:#fff;border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,0.08);
    padding:34px 40px;position:relative;
  }
  .close-x{
    position:absolute;top:26px;right:26px;
    width:40px;height:40px;border-radius:50%;
    border:1px solid #eee;background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--green-700);
  }
  .top{display:flex;gap:24px;align-items:center;margin-bottom:30px;}
  .icon3d{
    width:110px;height:110px;border-radius:16px;
    background:linear-gradient(160deg,#eaf7ee,#dcefe0);
    display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;
  }
  .icon3d .card{
    width:56px;height:56px;border-radius:10px;background:var(--green-700);
    display:flex;align-items:center;justify-content:center;
  }
  .icon3d .base{
    position:absolute;bottom:14px;width:80px;height:14px;border-radius:50%;
    background:#dfeee2;
  }
  .label-tag{color:var(--green-700);font-weight:700;font-size:13px;letter-spacing:1px;margin-bottom:6px;}
  h1{font-size:32px;font-weight:800;margin-bottom:8px;}
  .sub{font-size:14.5px;color:var(--gray-500);}

  .stats{display:flex;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
  .stat-card{
    flex:1;min-width:220px;
    display:flex;align-items:center;gap:16px;
    border-left:4px solid var(--green-600);
    border-radius:10px;background:#fafafa;
    padding:16px 20px;
  }
  .stat-icon{
    width:44px;height:44px;border-radius:50%;
    background:#e6f4ea;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .stat-num{font-size:24px;font-weight:800;color:#111;}
  .stat-label{font-size:13.5px;color:#333;}

  .empty-box{
    border:1px solid #eee;border-radius:14px;
    padding:60px 30px;text-align:center;position:relative;overflow:hidden;
    margin-bottom:24px;background:
      radial-gradient(circle,rgba(0,0,0,0.02) 1px,transparent 1px);
    background-size:16px 16px;
  }
  .empty-circle{
    width:130px;height:130px;border-radius:50%;
    border:2px dashed #ddd;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 26px;position:relative;
  }
  .empty-circle-inner{
    width:96px;height:96px;border-radius:50%;
    background:#eaf7ee;display:flex;align-items:center;justify-content:center;
  }
  .empty-box h3{font-size:21px;font-weight:800;margin-bottom:10px;}
  .empty-box p{color:var(--gray-500);font-size:14.5px;}

  .footer-bar{
    display:flex;align-items:center;justify-content:space-between;
    border:1px solid #eee;border-radius:12px;
    padding:16px 22px;flex-wrap:wrap;gap:14px;
  }
  .footer-note{display:flex;align-items:center;gap:12px;font-size:14px;color:#333;}
  .hex-badge{
    width:30px;height:30px;background:var(--green-700);
    clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .divider{width:1px;height:20px;background:#ddd;}
  .close-btn{
    background:var(--green-700);color:#fff;border:none;
    padding:11px 24px;border-radius:8px;font-weight:700;font-size:14.5px;cursor:pointer;
  }
  footer.page-footer{
    text-align:center;color:#9ca3af;font-size:13px;margin-top:26px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  footer.page-footer b{color:var(--green-700);}
</style>
</head>
<body>
  <div class="modal">
    <div class="close-x">&times;</div>
    <div class="top">
      <div class="icon3d">
        <div class="base"></div>
        <div class="card">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#fff" stroke-width="1.8"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="0.6" fill="#fff"/></svg>
        </div>
      </div>
      <div>
        <div class="label-tag">&#8226; INSIGHTS</div>
        <h1>Frequently Asked Questions</h1>
        <div class="sub">Force Pressure &bull; July 25, 2026</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#166534" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </div>
        <div><div class="stat-num">0</div><div class="stat-label">FAQ topics</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 17l6-6 4 4 8-8" stroke="#166534" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div><div class="stat-num">0</div><div class="stat-label">repeated asks</div></div>
      </div>
    </div>

    <div class="empty-box">
      <div class="empty-circle">
        <div class="empty-circle-inner">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 01-9 8.4 8.5 8.5 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 018.4-9h.5a8.48 8.48 0 018 8v.5z" stroke="#166534" stroke-width="1.6"/><path d="M12 9v4M12 16h.01" stroke="#166534" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
      </div>
      <h3>No frequently asked questions yet</h3>
      <p>FAQs appear here after students ask similar questions more than once.</p>
    </div>

    <div class="footer-bar">
      <div class="footer-note">
        <div class="hex-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2l1.5 3 3.3.5-2.4 2.3.6 3.3L12 9.5 9 11.1l.6-3.3L7.2 5.5l3.3-.5L12 2z" fill="#fff"/></svg>
        </div>
        <div class="divider"></div>
        <span>Only recurring student questions are shown.</span>
      </div>
      <button class="close-btn">Close</button>
    </div>
  </div>

  <footer class="page-footer" style="position:fixed;bottom:14px;left:0;right:0;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2 L20 5 V11 C20 16 16.5 20 12 22 C7.5 20 4 16 4 11 V5 Z" fill="#166534"/></svg>
    &copy;2026 <b>Iqbalai</b>. All Rights Reserved
  </footer>
</body>
</html>
