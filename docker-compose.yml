version: "3.9"

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./static:/app/static
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      flask_app1:
        condition: service_healthy
      # TEMPORARILY COMMENTED OUT FOR PERFORMANCE TESTING - UNCOMMENT TO RESTORE
      # flask_app2:
      #   condition: service_healthy
      # flask_app3:
      #   condition: service_healthy
      # flask_app4:
      #   condition: service_healthy
    networks:
      - app_network

  # ----------------------------
  # POSTGRES DATABASE (primary)
  # ----------------------------
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ----------------------------
  # MILVUS (vector database for RAG)
  # ----------------------------
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    restart: always
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  # ----------------------------
  # REDIS (for Celery broker and result backend)
  # ----------------------------
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------
  # PRIMARY FLASK INSTANCE
  # ----------------------------
  flask_app1:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - OPENBLAS_NUM_THREADS=2
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - RAYON_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
      - TQDM_DISABLE=1
      - DB_MODE=primary
      - INSTANCE_ROLE=primary

      # PostgreSQL URL (IMPORTANT)
      - DATABASE_URL=postgresql://myuser:mypassword@postgres:5432/mydatabase

      # APIs
      - GOOGLE_CLIENT_ID=507995986306-qcdrhrrt3d71la4pkrf7lt1b2tvuusqm.apps.googleusercontent.com
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NOMIC_APIC_KEY=${NOMIC_API_KEY}

      # vLLM API
      - VLLM_API_BASE=http://69.28.92.113:8000/v1
      - VLLM_MODEL=Qwen/Qwen2.5-14B-Instruct

      - VLLM_TIMEOUT=600

      # Celery Configuration
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

      # Milvus (RAG vector database)
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_DIM=384

    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 20G
        reservations:
          cpus: "2"
          memory: 12G
    networks:
      - app_network

  # ----------------------------
  # CELERY WORKER
  # ----------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - TOKENIZERS_PARALLELISM=false
      - TQDM_DISABLE=1
      
      # Database
      - DATABASE_URL=postgresql://myuser:mypassword@postgres:5432/mydatabase
      
      # Celery Configuration
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      
      # APIs (if needed by tasks)
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NOMIC_APIC_KEY=${NOMIC_API_KEY}
      - VLLM_API_BASE=http://69.28.92.113:8000/v1
      - VLLM_MODEL=Qwen/Qwen2.5-14B-Instruct
      - VLLM_TIMEOUT=600

      # Milvus (RAG vector database)
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_DIM=384
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    command: celery -A app.celery_app.celery worker --loglevel=info --concurrency=2
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 16G
        reservations:
          cpus: "2"
          memory: 8G
    networks:
      - app_network
    restart: unless-stopped

